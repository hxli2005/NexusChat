syntax = "proto3";

package message.v1;

option go_package = "github.com/lhx/nexuschat/api/message/v1;messagev1";

service MessageService {
  rpc GetHistory(GetHistoryRequest) returns (GetHistoryResponse);
}

message GetHistoryRequest {
  int64 conversation_id = 1;
  int64 before_msg_id = 2;
  int32 limit = 3;
}

message GetHistoryResponse {
  repeated MessageRecord messages = 1;
}

message MessageRecord {
  int64 msg_id = 1;
  int64 sender_id = 2;
  int64 conversation_id = 3;
  string content = 4;
  int64 created_at = 5;
  bool is_ai = 6;
}
